<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Romancha — offline</title>
    <style>
      body { background: #0d0714; color: #f5e6eb; font-family: system-ui, sans-serif; padding: 32px; }
      p { color: #c9a7b2; font-size: 14px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <h1 style="font-size:20px">You are offline</h1>
    <p>Reconnect to load your matches and messages. Your chats are not stored by this service worker — no photo, no message and no
      auth response is ever written to the offline cache.</p>
    <p><button onclick="location.reload()" style="background:#e11d48;color:#fff;border:0;border-radius:12px;padding:10px 16px;font-size:14px">Try again</button></p>
  </body>
</html>
